<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sand2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg2)"/>

  <!-- Magic circle behind hourglass -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 6"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.15" stroke-dasharray="2 10"/>

  <!-- Rune marks on circle -->
  <g font-family="serif" font-size="14" fill="#a78bfa" opacity="0.4" text-anchor="middle">
    <text x="128" y="34">✦</text>
    <text x="128" y="232">✦</text>
    <text x="32" y="132">✦</text>
    <text x="224" y="132">✦</text>
    <text x="58" y="62">◇</text>
    <text x="198" y="62">◇</text>
    <text x="58" y="204">◇</text>
    <text x="198" y="204">◇</text>
  </g>

  <!-- Hourglass frame - top cap -->
  <rect x="76" y="44" width="104" height="10" rx="5" fill="#a78bfa"/>
  <rect x="82" y="48" width="92" height="3" rx="1.5" fill="#c4b5fd" opacity="0.5"/>

  <!-- Hourglass frame - bottom cap -->
  <rect x="76" y="202" width="104" height="10" rx="5" fill="#a78bfa"/>
  <rect x="82" y="205" width="92" height="3" rx="1.5" fill="#c4b5fd" opacity="0.5"/>

  <!-- Hourglass frame - side pillars -->
  <rect x="80" y="44" width="5" height="168" rx="2.5" fill="#8b5cf6"/>
  <rect x="171" y="44" width="5" height="168" rx="2.5" fill="#8b5cf6"/>

  <!-- Hourglass top glass -->
  <path d="M90,56 L90,100 C90,120 128,134 128,134 C128,134 166,120 166,100 L166,56 Z"
        fill="url(#glass2)" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- Hourglass bottom glass -->
  <path d="M90,200 L90,156 C90,136 128,122 128,122 C128,122 166,136 166,156 L166,200 Z"
        fill="url(#glass2)" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- Sand top (less sand, draining) -->
  <path d="M96,68 L96,92 C96,106 128,116 128,116 C128,116 160,106 160,92 L160,68 Z"
        fill="url(#sand2)" opacity="0.3"/>

  <!-- Sand stream -->
  <rect x="126.5" y="116" width="3" height="24" rx="1.5" fill="#fbbf24" opacity="0.7"/>

  <!-- Sand bottom (more sand, filling) -->
  <path d="M100,200 L100,178 C100,166 128,158 128,158 C128,158 156,166 156,178 L156,200 Z"
        fill="url(#sand2)" opacity="0.6"/>

  <!-- Sand particles falling -->
  <circle cx="126" cy="124" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="130" cy="130" r="1.2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="127" cy="136" r="1" fill="#fbbf24" opacity="0.5"/>
  <circle cx="129" cy="142" r="1.3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="127" cy="148" r="1" fill="#fbbf24" opacity="0.4"/>

  <!-- Magic glow at the neck -->
  <ellipse cx="128" cy="128" rx="12" ry="6" fill="#c084fc" opacity="0.2"/>

  <!-- Sparkles around hourglass -->
  <g fill="#fbbf24">
    <circle cx="56" cy="80" r="2.5" opacity="0.7"/>
    <circle cx="200" cy="85" r="2" opacity="0.5"/>
    <circle cx="48" cy="165" r="2" opacity="0.5"/>
    <circle cx="208" cy="170" r="2.5" opacity="0.6"/>
    <circle cx="64" cy="128" r="1.5" opacity="0.4"/>
    <circle cx="192" cy="128" r="1.8" opacity="0.4"/>
  </g>

  <!-- Star sparkle top-right -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="194" y="44" width="10" height="2" rx="1"/>
    <rect x="198" y="40" width="2" height="10" rx="1"/>
  </g>
  <!-- Star sparkle bottom-left -->
  <g fill="#fbbf24" opacity="0.5">
    <rect x="42" y="196" width="8" height="2" rx="1"/>
    <rect x="45" y="193" width="2" height="8" rx="1"/>
  </g>
</svg>
